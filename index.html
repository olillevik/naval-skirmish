<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Naval Skirmish</title>
    <style>
      /* The page never scrolls or zooms, so every touch goes to the game. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1f; touch-action: none; }
      /* Screens and the rotate message are page elements laid over the game's canvas. */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #eaf6ff;
        background: rgb(11 14 31 / 0.75);
        user-select: none;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 2.5rem; }
      .overlay p { margin: 0; font-size: 1.25rem; }
      .overlay button {
        font: inherit;
        font-size: 1.25rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        color: #0b0e1f;
        background: #eaf6ff;
        cursor: pointer;
      }
      #start-screen { cursor: pointer; }
      #hud {
        position: fixed;
        top: 1rem;
        left: 1rem;
        display: flex;
        flex-direction: column;
        font: bold 1.25rem system-ui, sans-serif;
        color: #eaf6ff;
        text-shadow: 0 0 3px #0b0e1f, 0 0 3px #0b0e1f;
        pointer-events: none;
        user-select: none;
      }
      #edge-warning {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font: bold 1.25rem system-ui, sans-serif;
        color: #fff;
        background: rgb(170 30 30 / 0.85);
        pointer-events: none;
        user-select: none;
      }
      /* Phone controls. A coarse pointer means a touch screen, as for the rotate message. */
      .touch-control {
        display: none;
        position: fixed;
        top: 0;
        bottom: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      @media (pointer: coarse) {
        .touch-control { display: block; }
      }
      #steering-area { left: 0; width: 50%; }
      /* The whole right strip catches the thumb. The track inside it shows the throttle. */
      #throttle-lever { right: 0; width: 6rem; }
      #lever-track {
        position: absolute;
        top: 3rem;
        /* Leaves room below for the Fireball button. */
        bottom: 5.75rem;
        right: 1.5rem;
        width: 2.5rem;
        overflow: hidden;
        border: 2px solid #eaf6ff;
        border-radius: 0.5rem;
        background: rgb(11 14 31 / 0.65);
      }
      #lever-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #eaf6ff; }
      #lever-value {
        position: absolute;
        top: 0.75rem;
        right: 1rem;
        width: 3.5rem;
        text-align: center;
        font: bold 1rem system-ui, sans-serif;
        color: #eaf6ff;
        text-shadow: 0 0 3px #0b0e1f, 0 0 3px #0b0e1f;
      }
      /* Sits at the foot of the throttle lever, under the right thumb. */
      #fireball-button {
        display: none;
        position: fixed;
        right: 0.75rem;
        bottom: 1rem;
        width: 4rem;
        height: 4rem;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 2px solid #eaf6ff;
        border-radius: 50%;
        font: bold 0.9rem system-ui, sans-serif;
        line-height: 1.1;
        text-align: center;
        color: #0b0e1f;
        background: #ff9a2e;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Cooling down, or no enemy in range. */
      #fireball-button.waiting { color: #eaf6ff; background: rgb(11 14 31 / 0.65); }
      @media (pointer: coarse) {
        #fireball-button { display: flex; }
      }
      /* The game is landscape only. A coarse pointer means a phone or tablet, not a narrow desktop window. */
      #rotate-message { display: none; z-index: 1; background: #0b0e1f; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-message { display: flex; }
      }
    </style>
  </head>
  <body>
    <!-- Before the overlays, so the start, game-over and rotate screens cover the controls. -->
    <div id="steering-area" class="touch-control" data-testid="steering-area"></div>
    <div id="throttle-lever" class="touch-control" data-testid="throttle-lever">
      <div id="lever-track" data-testid="lever-track"><div id="lever-fill"></div></div>
      <span id="lever-value" data-testid="throttle-value">0%</span>
    </div>
    <button id="fireball-button" type="button" class="waiting" data-testid="fireball-button">No target</button>
    <div id="hud">
      <span id="wave" data-testid="wave">Wave 1</span>
      <span id="countdown" data-testid="countdown">starts in 5</span>
      <span id="health" data-testid="health">Health 100</span>
      <span id="gold" data-testid="gold">Gold 0</span>
      <span id="fireball" data-testid="fireball">Fireball ready</span>
    </div>
    <div id="start-screen" class="overlay" data-testid="start-screen">
      <h1>Naval Skirmish</h1>
      <p>Tap or click to start</p>
    </div>
    <div id="edge-warning" data-testid="edge-warning" hidden>Past the point of no return!</div>
    <div id="game-over" class="overlay" data-testid="game-over" hidden>
      <h1>Game over</h1>
      <p id="end-cause" data-testid="end-cause">The dinghy fell off the Edge</p>
      <p id="score" data-testid="score">Score 0</p>
      <p id="best-score" data-testid="best-score">Best score 0</p>
      <button id="new-run" type="button" data-testid="new-run">New Run</button>
    </div>
    <div id="rotate-message" class="overlay" data-testid="rotate-message">
      <p>Turn your phone to landscape</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
