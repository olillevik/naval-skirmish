<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Naval Skirmish</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1f; }
      /* Screens and the rotate message are page elements laid over the game's canvas. */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #eaf6ff;
        background: rgb(11 14 31 / 0.75);
        user-select: none;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 2.5rem; }
      .overlay p { margin: 0; font-size: 1.25rem; }
      .overlay button {
        font: inherit;
        font-size: 1.25rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        color: #0b0e1f;
        background: #eaf6ff;
        cursor: pointer;
      }
      #start-screen { cursor: pointer; }
      #edge-warning {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font: bold 1.25rem system-ui, sans-serif;
        color: #fff;
        background: rgb(170 30 30 / 0.85);
        pointer-events: none;
        user-select: none;
      }
      /* The game is landscape only. A coarse pointer means a phone or tablet, not a narrow desktop window. */
      #rotate-message { display: none; z-index: 1; background: #0b0e1f; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-message { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="start-screen" class="overlay" data-testid="start-screen">
      <h1>Naval Skirmish</h1>
      <p>Tap or click to start</p>
    </div>
    <div id="edge-warning" data-testid="edge-warning" hidden>Past the point of no return!</div>
    <div id="game-over" class="overlay" data-testid="game-over" hidden>
      <h1>Game over</h1>
      <p>The Dinghy fell off the Edge</p>
      <button id="new-run" type="button" data-testid="new-run">New Run</button>
    </div>
    <div id="rotate-message" class="overlay" data-testid="rotate-message">
      <p>Turn your phone to landscape</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
